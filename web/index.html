<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Salesforce Business Manager — track revenue, costs, marketing spend and net profit across every business, product and financial year.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F8FC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1016" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Business Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Fonts (Inter via google_fonts) and Firestore: open the connections early. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <title>Salesforce Business Manager</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Paint the splash in the theme the app is about to use: the cached
    // organisation brand + default mode, or this device's chosen mode. These
    // are shared_preferences entries (localStorage "flutter.<key>", JSON).
    (function () {
      try {
        var ls = window.localStorage;
        var read = function (k) {
          var v = ls.getItem('flutter.' + k);
          if (v == null) return null;
          try { v = JSON.parse(v); } catch (e) { return v; }
          if (typeof v === 'string' && v.charAt(0) === '{') {
            try { return JSON.parse(v); } catch (e) { return v; }
          }
          return v;
        };
        var org = read('sbm_org_theme_v1');
        if (typeof org !== 'object') org = null;
        var mode = read('sbm.d.themeMode') || (org && org.defaultMode) || 'light';
        var dark = mode === 'dark' || (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (org && typeof org.brand === 'number') {
          var hex = ('000000' + (org.brand & 0xFFFFFF).toString(16)).slice(-6);
          root.style.setProperty('--sbm-brand', '#' + hex);
        }
      } catch (e) { /* storage blocked: use the defaults below */ }
    })();
  </script>

  <style>
    :root {
      --sbm-brand: #582DD3;
      --sbm-canvas: #F7F8FC;
      --sbm-track: #E5E7EB;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) { --sbm-canvas: #0E1016; --sbm-track: #262B36; }
    }
    :root[data-theme='dark'] { --sbm-canvas: #0E1016; --sbm-track: #262B36; }
    html, body { margin: 0; height: 100%; background: var(--sbm-canvas); }
    #sbm-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; background: var(--sbm-canvas);
      transition: opacity 240ms ease-out;
    }
    #sbm-splash.sbm-hide { opacity: 0; pointer-events: none; }
    .sbm-mark {
      width: 64px; height: 64px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--sbm-brand),
          color-mix(in srgb, var(--sbm-brand) 72%, #000));
      box-shadow: 0 12px 32px -12px color-mix(in srgb, var(--sbm-brand) 60%, transparent);
    }
    .sbm-bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: var(--sbm-track);
    }
    .sbm-bar span {
      display: block; width: 40%; height: 100%; border-radius: 3px;
      background: var(--sbm-brand);
      animation: sbm-load 1.1s ease-in-out infinite;
    }
    @keyframes sbm-load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #sbm-splash { transition: none; }
      .sbm-bar span { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="sbm-splash" role="progressbar" aria-label="Loading Business Manager">
    <div class="sbm-mark">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true">
        <path d="M21 8c-1.45 0-2.26 1.44-1.93 2.51l-3.55 3.56c-.3-.09-.74-.09-1.04 0l-2.55-2.55C12.27 10.45 11.46 9 10 9c-1.45 0-2.27 1.44-1.93 2.52l-4.56 4.55C2.44 15.74 1 16.55 1 18c0 1.1.9 2 2 2 1.45 0 2.26-1.44 1.93-2.51l4.55-4.56c.3.09.74.09 1.04 0l2.55 2.55C12.73 16.55 13.54 18 15 18c1.45 0 2.27-1.44 1.93-2.52l3.56-3.55c1.07.33 2.51-.48 2.51-1.93 0-1.1-.9-2-2-2z"/>
        <path d="M15 9l.94-2.07L18 6l-2.06-.93L15 3l-.92 2.07L12 6l2.08.93zM3.5 11L4 9l2-.5L4 8l-.5-2L3 8l-2 .5L3 9z"/>
      </svg>
    </div>
    <div class="sbm-bar"><span></span></div>
  </div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; text-align: center; margin-top: 40vh;">
      Business Manager needs JavaScript. Please enable it and reload the page.
    </p>
  </noscript>
  <script>
    // Fade the splash out once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('sbm-splash');
      if (!s) return;
      s.classList.add('sbm-hide');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
